<script>
(function () {
  if (!tripStatus.active) return;
  var latest = tripStatus.updates && tripStatus.updates[0];
  if (!latest || !latest.photo) return;
  var url = latest.photo;
  if (!/^https?:\/\//i.test(url)) {
    if (location.hostname === 'thanks4coming.github.io') {
      var basePath = location.pathname.replace(/\/[^/]*$/, '/');
      url = 'https://thanks4coming.github.io' + basePath + url.replace(/^\//, '');
    } else {
      url = new URL(url, location.href).href;
    }
  }
  var og = document.querySelector('meta[property="og:image"]');
  if (og) og.setAttribute('content', url);
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0}
/* === SIDEBAR + MAP LAYOUT === */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sidebar{width:400px;min-width:400px;background:#1e293b;overflow-y:auto;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0;-webkit-overflow-scrolling:touch}
#map{flex:1;background:#1a1a1a;position:relative}
/* Sidebar header */
#sidebar-header{padding:16px 20px 10px;background:linear-gradient(135deg,#1e3a5f,#1e293b);border-bottom:1px solid #334155;position:sticky;top:0;z-index:10;flex-shrink:0}
#sidebar-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}

#sidebar-header .hud-sub{font-size:10px;color:#94a3b8;margin-top:2px}
#sidebar-header .hud-live{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;font-weight:600;color:#4ade80}
#sidebar-header .hud-live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:here-pulse 2s infinite}
#sidebar-close-btn{background:rgba(51,65,85,.7);border:1px solid rgba(148,163,184,.15);border-radius:6px;padding:5px 10px;color:#94a3b8;font-size:12px;cursor:pointer;display:none;flex-shrink:0;line-height:1.4}
#sidebar-close-btn:hover{background:#334155;color:#fff}
/* Map-top toggles (Photos / Trail) — small overlay on the map */
#map-hud{position:absolute;top:0;right:0;z-index:500;display:flex;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;pointer-events:none}
.hud-pill{display:flex;align-items:center;gap:6px;padding:7px 11px;background:rgba(15,23,42,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(148,163,184,.18);border-radius:999px;cursor:pointer;user-select:none;font-size:10px;color:#cbd5e1;font-weight:500;box-shadow:0 2px 12px rgba(0,0,0,.25);transition:background .15s;pointer-events:auto}
.hud-pill:hover{background:rgba(30,41,59,.88)}
.hud-pill input{display:none}
.hud-pill .toggle-track{width:26px;height:14px;background:#334155;border-radius:7px;position:relative;transition:background .2s;flex-shrink:0}
.hud-pill .toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:#94a3b8;border-radius:50%;transition:transform .2s,background .2s}
.hud-pill input:checked+.toggle-track{background:#2563eb}
.hud-pill input:checked+.toggle-track::after{transform:translateX(12px);background:#fff}
#trail-checkbox:checked+.toggle-track{background:#22c55e}
/* Mobile open button */
#sidebar-open-btn{display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:999;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:28px;padding:12px 24px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;align-items:center;gap:6px}

@media(max-width:900px){

#sidebar{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);min-width:0;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0)}
#sidebar.open{transform:translateX(0)}
#map{width:100%;height:100vh;height:100dvh}
#sidebar-open-btn{display:flex}
#sidebar-close-btn{display:block}

}

.elev-label{font-size:10px;font-weight:700;color:#60a5fa}

/* ---- TRIP LIVE STATUS ---- */

.tl-coords{font-size:8.5px;color:#334155;font-family:ui-monospace,monospace;margin-top:2px}

/* ---- DOCK (bottom timeline + detail panel) ---- */

/**
 * Total planned CYCLING distance (km) — used for live progress bar.
 * Sum of each segment's cycling-only km (excludes ferry crossings and the
 * Klaipėda→Vilnius→Warsaw train/bus, which were never meant to be ridden).
 * Segment 7 (Warsaw→Łódź→Kraków, ~400 km) is excluded entirely: it was
 * actually skipped via train, so it no longer needs to be ridden.
 * 620 (seg1) + 350 (seg3) + 284 (seg4) + 710 (seg6) + 2000 (seg8, post
 * ferry-fix) + 1500 (seg9) = 5464. Keep in sync with route/segment totals.
 */
const TRIP_TOTAL_KM = 5464;

function tripHasProgress() {
  return !!(tripStatus && (tripStatus.active || tripStatus.finished));
}
function segmentRideStatus(seg) {
  if (tripStatus.finished) {
    return seg.id <= tripStatus.currentSegment ? 'done' : 'upcoming';
  }
  if (tripStatus.active) {
    if (seg.id < tripStatus.currentSegment) return 'done';
    if (seg.id === tripStatus.currentSegment) return 'current';
    return 'upcoming';
  }
  return 'upcoming';
}

function showTravelToast(msg, isErr) {
  var el = document.getElementById('travel-toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'travel-toast';
  el.setAttribute('role', 'status');
  var bg = isErr ? '#7f1d1d' : '#1e293b';
  var br = isErr ? '#dc2626' : '#334155';
  var fg = isErr ? '#fecaca' : '#60a5fa';
  var dockH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dock-h')) || 130;
  el.style.cssText = 'position:fixed;bottom:calc(' + (dockH + 12) + 'px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:' + bg + ';color:' + fg + ';padding:10px 16px;border-radius:8px;font-size:11px;font-family:Segoe UI,system-ui,sans-serif;z-index:1001;border:1px solid ' + br + ';box-shadow:0 4px 12px rgba(0,0,0,.5);max-width:92vw;text-align:center;line-height:1.45';
  el.textContent = msg;
  document.body.appendChild(el);

      { name: "Suomenlinna Sea Fortress", dist: "+ferry from Helsinki", time: "Half day", desc: "UNESCO World Heritage fortress on an island in Helsinki harbour. 15-minute ferry. Walk the ramparts, tunnels, museums. Finland\u2019s most visited attraction. Do this while in Helsinki.", verdict: "must", lat: 60.1450, lng: 24.9880 }

  {

    title: "Tallinn \u2192 Baltic Coast \u2192 Klaip\u0117da + Train/Bus (via Vilnius overnight) to Warsaw",
    routeName: "EuroVelo 10 (Baltic Sea Cycle Route) + Train Klaip\u0117da\u2192Vilnius + Bus Vilnius\u2192Warsaw",
    color: "#ef4444",
    transport: "bike",
    distance: "~710 km cycling + train + bus",
    days: "13\u201315 days",
    schengenDays: "13\u201315",
    description: "Down the eastern Baltic coast through Estonia and Latvia to Lithuania via EuroVelo 10, then train Klaip\u0117da\u2192Vilnius and overnight bus Vilnius\u2192Warsaw \u2014 skipping the Kaliningrad-adjacent section and arriving in Warsaw to begin the Poland cycling leg. Vilnius is a genuine highlight: one of Europe\u2019s best-preserved Baroque old towns, UNESCO listed, and very cheap. Terrain is flat throughout. Signage excellent in Estonia, patchy in Latvia. GPS/GPX essential.",
    stages: [
      { name: "Tallinn \u2192 P\u00e4rnu", dist: "~130 km, 2 days (~3.5 hrs/day)", desc: "Leave Tallinn Old Town (UNESCO \u2014 spend a full day exploring first). Coastal road south. Option: direct route via Highway 4 (faster, less scenic) or coastal route via Haapsalu (+80 km, much nicer). P\u00e4rnu: Estonia\u2019s summer capital, wide beach, Red Tower, Museum of New Art." },
      { name: "P\u00e4rnu \u2192 Latvian Border (Ainaži)", dist: "~60 km, 1 day (~3.5 hrs)", desc: "Quiet coastal roads through pine forest. Cross into Latvia at Ainaži. Easy border crossing (both Schengen, no checks)." },
      { name: "Ainaži \u2192 R\u012bga", dist: "~180 km, 2\u20133 days (~3.5 hrs/day)", desc: "Latvian coast: Salacgr\u012bva fishing village, Saulkrasti white sand dunes. Through J\u016brmala beach resort (wooden Art Nouveau villas \u2014 ride the 25 km seafront bike path). R\u012bga: Art Nouveau district (800+ buildings \u2014 the best collection in Europe), Central Market in former Zeppelin hangars, medieval Old Town." },
      { name: "R\u012bga \u2192 Liep\u0101ja", dist: "~220 km, 3\u20134 days (~3.5 hrs/day)", desc: "West along the coast. Through Tukums, Talsi. Ventspils: clean Blue Flag beach, cow parade sculptures. Liep\u0101ja: Karosta district (former Soviet naval base \u2014 abandoned prison, military architecture, genuinely eerie and fascinating)." },
      { name: "Liep\u0101ja \u2192 Klaip\u0117da", dist: "~110 km, 2 days (~3 hrs/day)", desc: "Cross into Lithuania. Through Palanga: amber museum in a botanical garden, sunset from the 470m pier. Klaip\u0117da: Old Town, Theatre Square. End of the cycling leg for this segment." },
      { name: "Train: Klaip\u0117da \u2192 Vilnius", dist: "~310 km, 1 day (~4.5 hrs travel)", desc: "LTG Link InterCity \u2014 modern renovated carriages, power outlets, café/trolley service, dedicated bike spaces. Book bike spot in advance. Arrive Vilnius evening. Vilnius overnight: one of Europe\u2019s most underrated cities. Baroque Old Town is UNESCO listed, cathedral square, Gediminas Castle, Gate of Dawn. Extremely cheap \u2014 dinner and a beer for under \u20AC15. Stay in the Old Town." },
      { name: "Bus: Vilnius \u2192 Warsaw", dist: "~450 km, overnight (~9 hrs)", desc: "Lux Express overnight coach with bike ticket. Arrive Warsaw early morning and head into the Poland cycling leg. Warsaw overnight if arriving late \u2014 postwar rebuilt old town, vibrant food scene, very affordable." }
    ],
    detours: [
      { name: "Saaremaa & Hiiumaa Islands", dist: "+300 km, 4\u20135 extra days", time: "4\u20135 days", desc: "From P\u00e4rnu or Haapsalu, ferry to Estonia\u2019s western islands. Saaremaa: Kuressaare medieval castle, Kaali meteorite crater (3,500 years old), dramatic cliffs. Hiiumaa: K\u00f5pu lighthouse (one of the world\u2019s oldest, operating since 1531). Flat, empty, wildly beautiful. Free inter-island ferries. This is Estonia\u2019s best cycling.", verdict: "highly", lat: 58.4200, lng: 22.1000 },
      { name: "Sigulda & Gauja National Park", dist: "+160 km round trip from R\u012bga", time: "2 days", desc: "Inland from R\u012bga to \u2018Latvia\u2019s Switzerland.\u2019 Gauja river valley with medieval castle ruins (Turaida Castle, Sigulda Castle), cable car across the valley, Gutmana cave (Latvia\u2019s largest), bobsled track. Stunning in any season. Well worth the inland detour.", verdict: "highly", lat: 57.1530, lng: 24.8540 },
      { name: "Kuld\u012bga & Ventas Rumba", dist: "+80 km round trip from coast", time: "1 day", desc: "Europe\u2019s widest natural waterfall (249m across). Tiny Latvian town with a beautiful brick bridge. Flying fish leap over the falls in spring. Charming, off-the-beaten-path, totally unique.", verdict: "highly", lat: 56.9680, lng: 21.9670 },
      { name: "Lahemaa National Park", dist: "+50 km loop from Tallinn", time: "1 day", desc: "Estonia\u2019s oldest and largest national park, just 70 km east of Tallinn. Glacial boulders on wild beaches, pristine bogs with boardwalk trails, restored Soviet-era fishing villages (K\u00e4smu, Altja), and four magnificent manor houses hidden in forest. The Viru Bog boardwalk at dawn is otherworldly.", verdict: "highly", lat: 59.5650, lng: 25.7800 },
      { name: "Cape Kolka (Kolkasrags)", dist: "+60 km detour from coastal route", time: "Half day", desc: "The very tip of Latvia\u2019s Courland peninsula where the Baltic Sea meets the Gulf of R\u012bga. Wild, windswept, and almost deserted. Hundreds of shipwrecks offshore. Former Soviet restricted zone \u2014 the L\u012bv\u0101ni (Livonian) fishing villages along this coast are among the emptiest, most atmospheric places in Europe.", verdict: "highly", lat: 57.7580, lng: 22.5960 }

  {
    id: 7,
    title: "Warsaw \u2192 \u0141\u00f3d\u017a \u2192 Krak\u00f3w",
    routeName: "Warsaw \u2192 \u0141\u00f3d\u017a \u2192 Cz\u0119stochowa \u2192 Krak\u00f3w / EuroVelo 9",
    color: "#f97316",
    transport: "bike",
    distance: "~400 km",
    days: "6\u20139 days",
    schengenDays: "6\u20139",
    description: "Direct south from Warsaw through central Poland to Krak\u00f3w. Flat agricultural lowlands from Warsaw to \u0141\u00f3d\u017a, then gently rolling through central Poland, building to proper limestone upland terrain in the final stretch through the Jura Krakowsko-Cz\u0119stochowska. This direct route saves ~300 km and 4\u20135 days compared to the full Gdansk\u2013Vistula loop, while still hitting Poland\u2019s headline attractions: \u0141\u00f3d\u017a\u2019s industrial culture, Cz\u0119stochowa\u2019s Jasna G\u00f3ra, and the dramatic Eagle\u2019s Nest castle trail into Krak\u00f3w. EuroVelo 9 markers from \u0141\u00f3d\u017a south. Mostly asphalt with gravel sections near Cz\u0119stochowa.",
    stages: [
      { name: "Warsaw \u2192 \u0141\u00f3d\u017a", dist: "~130 km, 2 days (~3.5 hrs/day)", desc: "South-west from Warsaw through Mazovian agricultural flatlands via \u017byrard\u00f3w and Skierniewice on quiet back roads \u2014 this is genuinely flat terrain, ideal for the first cycling day after a long train. \u0141\u00f3d\u017a: Poland\u2019s third city and most underrated. Piotrkowska Street (4.2 km \u2014 Europe\u2019s longest commercial street), the Manufaktura complex (former textile mill turned culture/entertainment hub), extraordinary street art throughout the city, and a deep film heritage \u2014 Polański, Kieślowski, and Wajda all studied at the film school here." },
      { name: "\u0141\u00f3d\u017a \u2192 Cz\u0119stochowa", dist: "~130 km, 2 days (~3.5 hrs/day)", desc: "South-west through gentle rolling farmland on quiet EuroVelo 9 roads. Wide open Polish countryside. Cz\u0119stochowa: Jasna G\u00f3ra monastery \u2014 home of the Black Madonna icon, Poland\u2019s most sacred pilgrimage site and one of the major religious destinations in Europe. The imposing fortified monastery crowns a hill above the city \u2014 you see it for kilometres before you arrive." },
      { name: "Cz\u0119stochowa \u2192 Krak\u00f3w", dist: "~140 km, 2\u20133 days (~4 hrs/day)", desc: "The terrain transforms dramatically \u2014 entering the Jura Krakowsko-Cz\u0119stochowska (Polish Jurassic Uplands). Limestone cliffs, ruined castles perched on rocky outcrops, cave-riddled gorges, and forested tracks. This is the Eagle\u2019s Nest Trail section (Szlak Orlich Gniazd) \u2014 one of the most spectacular cycling landscapes in Poland. The final approach into Krak\u00f3w through Ojc\u00f3w National Park gorge is unforgettable. Krak\u00f3w: Wawel Castle, the vast Main Market Square (largest medieval square in Europe), St Mary\u2019s Basilica, Kazimierz Jewish Quarter. Plan 1\u20132 rest days." }
    ],
    detours: [
      { name: "Eagle\u2019s Nest Trail (Szlak Orlich Gniazd)", dist: "+40\u201360 km detour or on-route variant", time: "1\u20132 days", desc: "Chain of ruined medieval castles on dramatic limestone cliffs between Cz\u0119stochowa and Krak\u00f3w. Ogrodzieniec Castle is the most spectacular \u2014 massive ruins on a rocky outcrop. The landscape is unlike anything else in Poland. If time allows, take the full trail route rather than the direct road.", verdict: "highly", lat: 50.4530, lng: 19.5250 },
      { name: "Ojc\u00f3w National Park", dist: "+20 km or on approach to Krak\u00f3w", time: "Half day", desc: "Just 25 km northwest of Krak\u00f3w. Limestone gorges, cave systems, ruined castles on cliffs. Poland\u2019s smallest national park but one of its most beautiful. Ride through the gorge on the final approach to Krak\u00f3w for a spectacular city entrance.", verdict: "must", lat: 50.2100, lng: 19.8270 },
      { name: "Wieliczka Salt Mine", dist: "+15 km from Krak\u00f3w", time: "Half day", desc: "UNESCO World Heritage. Underground cathedral carved from salt, 300m below ground. One of the world\u2019s oldest operating mines (700+ years). Do this from Krak\u00f3w as a rest-day excursion.", verdict: "must", lat: 49.9830, lng: 20.0560 },
      { name: "Kazimierz Dolny", dist: "+130 km round trip from Warsaw or en route detour", time: "1 day", desc: "Renaissance jewel perched above the Vistula. Artists\u2019 colony since the 19th century. Crumbling hilltop castle, ornate merchant houses, gorges with loess pillars (the \u2018Polish Grand Canyon\u2019). Reachable as an east detour from the Warsaw\u2013\u0141\u00f3d\u017a corridor before heading south.", verdict: "highly", lat: 51.3200, lng: 21.9540 }
    ],

  {
    id: 8,
    title: "Krak\u00f3w \u2192 Vienna \u2192 Croatian Coast \u2192 Dubrovnik",
    routeName: "EuroVelo 9 + Adriatic Coast (EuroVelo 8)",
    color: "#ec4899",
    transport: "bike",
    distance: "~2,000 km cycling",
    days: "30\u201338 days",
    schengenDays: "30\u201338",
    description: "From Krak\u00f3w south through Czechia, Austria, and Slovenia to Croatia\u2019s Istrian coast, then the full Adriatic Highway / EuroVelo 8 south through Dalmatia to Dubrovnik \u2014 gateway to Montenegro and the Balkans. ALL SCHENGEN. \u26a0\ufe0f The Rijeka\u2192Split coastal stretch is real cycling (no mainland ferry shortcut): expect wind, traffic, and heat; plan shorter days along Velebit.",
    stages: [
      { name: "Krak\u00f3w \u2192 O\u015bwi\u0119cim \u2192 Czech border", dist: "~150 km, 2\u20133 days (~4.5 hrs/day)", desc: "West from Krak\u00f3w through Silesia. O\u015bwi\u0119cim (Auschwitz) is directly on-route \u2014 plan a full day. Cross into Czech Republic near \u010cesk\u00fd T\u011b\u0161\u00edn." },
      { name: "Czech Republic: Olomouc \u2192 Brno", dist: "~200 km, 3 days (~4 hrs/day)", desc: "Through Moravia. Olomouc: stunning baroque town with UNESCO Holy Trinity Column, massively underrated. Brno: Czech Republic\u2019s second city, lively student scene, Tugendhat Villa (Mies van der Rohe, UNESCO)." },
      { name: "Brno \u2192 Vienna", dist: "~130 km, 2 days (~4 hrs/day)", desc: "Cross into Austria near B\u0159eclav. Flat ride through the Weinviertel (wine quarter). Vienna: Ringstra\u00dfe, Schlo\u00df Sch\u00f6nbrunn, Stephansdom, coffee house culture. Spend 1\u20132 rest days minimum." },
      { name: "Vienna \u2192 Graz (Thermenradweg)", dist: "~200 km, 3\u20134 days (~5 hrs/day)", desc: "The Thermenradweg (Spas Cycle Route) south through Lower Austria and Styria. Baden: thermal baths. Wiener Neustadt. \u26a0\ufe0f First real mountain test of the trip \u2014 the Semmering area (approaching ~800\u2013900m from ~270m at Wiener Neustadt) is a genuine climb unlike anything in the previous 2,000 km. Total ascent over these days: ~1,500\u20132,000m. Battery range will drop noticeably for the first time. Plan charging stops in Wiener Neustadt and Mürzzuschlag before the descent into Styria. Once over the top, green rolling countryside eases you into Graz: red rooftops, Schlossberg hill, Kunsthaus. Spend a rest day \u2014 you\u2019ve earned it." },
      { name: "Graz \u2192 Maribor \u2192 Ljubljana", dist: "~250 km, 3\u20134 days (~5 hrs/day)", desc: "Cross into Slovenia at Bad Radkersburg. Maribor: oldest vine in the world (400+ years). Ljubljana: Europe\u2019s greenest capital, dragon bridge, castle on the hill, car-free old town, incredible food scene. Spend a rest day." },
      { name: "Ljubljana \u2192 Postojna \u2192 Rovinj", dist: "~200 km, 3\u20134 days (~5 hrs/day)", desc: "Through the Karst region. Postojna Cave (one of the world\u2019s largest show caves, train ride underground). \u0160kocjan Caves (UNESCO, even more dramatic). Cross into Croatia\u2019s Istria. Pula: Roman amphitheatre, 2,000 years old. Rovinj: Venetian jewel on the Adriatic." },
      { name: "Rovinj \u2192 Rijeka", dist: "~100 km, 1\u20132 days (~6.5 hrs)", desc: "North along the Istrian coast past Vrsar and Pore\u010d (6th-century Euphrasian Basilica, UNESCO). Through Novigrad to Umag, then along the Kvarner coast to Rijeka. Croatia\u2019s third-largest city, underrated \u2014 the 2020 European Capital of Culture." },
      { name: "Rijeka \u2192 Senj \u2192 Zadar", dist: "~250 km, 4\u20135 days (~4 hrs/day)", desc: "Join EuroVelo 8 / the Adriatic Highway south under Velebit. Senj: historic wind capital (the bura can shut the road \u2014 check forecasts). Coastal rollers, tunnels, and sea views the whole way into Zadar: Roman forum, sea organ, sunset cult. This is the stretch a ferry used to skip \u2014 ride it; start early and keep days shorter if the wind picks up." },
      { name: "Zadar \u2192 \u0160ibenik \u2192 Split", dist: "~160 km, 2\u20133 days (~5 hrs/day)", desc: "Continue EV8 through the Dalmatian coast. \u0160ibenik: UNESCO cathedral, gateway to Krka. Split: Diocletian\u2019s Palace (a living Roman ruin, people live inside it), Riva promenade. Spend a rest day." },
      { name: "Split \u2192 Makarska \u2192 Dubrovnik", dist: "~230 km, 3\u20134 days (~4.5 hrs/day)", desc: "Ride the Adriatic Highway south through Omi\u0161 canyon, the Makarska Riviera (Biokovo mountain meets turquoise sea), Plo\u010de, and the Neretva delta. Cross the Pelje\u0161ac Bridge. Final stretch into Dubrovnik \u2014 walk the city walls." }
    ],
    detours: [
      { name: "Wachau Valley (Danube)", dist: "+100 km detour from Vienna", time: "1\u20132 days", desc: "If approaching Vienna from the west, ride the famous Danube Cycle Path through the Wachau Valley. Terraced vineyards, medieval castles, Melk Abbey. One of Europe\u2019s most iconic cycle paths.", verdict: "highly", lat: 48.3660, lng: 15.4180 },
      { name: "\u0160kocjan Caves", dist: "+10 km detour", time: "Half day", desc: "UNESCO World Heritage. Massive underground canyon, river flowing through caverns. Less crowded and more dramatic than Postojna. Basically on-route between Ljubljana and the coast.", verdict: "must", lat: 45.6630, lng: 13.9910 },
      { name: "Krka National Park", dist: "+40 km detour from \u0160ibenik / Split", time: "Full day", desc: "Jaw-dropping series of waterfalls you can actually swim in. Skradinski Buk: a curtain of cascades flowing into emerald pools. Visovac monastery on a tiny island in the river. Best as a day from \u0160ibenik or a short detour off the Zadar\u2192Split stage.", verdict: "must", lat: 43.8010, lng: 15.9620 },
      { name: "Pelje\u0161ac Peninsula", dist: "+60 km loop", time: "1 day", desc: "Croatia\u2019s best-kept secret. Wine region (Dinga\u010d, Postup \u2014 world-class reds from steep coastal vineyards), oyster farms at Ston (taste them fresh at the harbour), and the 5.5 km Walls of Ston \u2014 second longest fortification in the world after the Great Wall. Accessible via the new Pelje\u0161ac Bridge.", verdict: "highly", lat: 42.9200, lng: 17.2500 },
      { name: "Dubrovnik City Walls", dist: "2 km walk", time: "Half day", desc: "Walk the full 2 km circuit of medieval walls encircling the Old Town. One of Europe\u2019s most spectacular urban experiences. Views over terracotta rooftops and the Adriatic. Do this on your final day before crossing into Montenegro.", verdict: "must", lat: 42.6410, lng: 18.1080 }

const layerGroups = {};
const segmentPolylines = {};
const stagePolylines = {};   // segId -> [polyline per stage]

function _clearStageOverlays() {
  Object.keys(stagePolylines).forEach(k => {
    stagePolylines[k].forEach(pl => pl.setStyle({ opacity: 0 }));
  });
}

function highlightSeg(segId) {
  _clearStageOverlays();
  const id = parseInt(segId);
  Object.keys(segmentPolylines).forEach(k => {
    const isTarget = parseInt(k) === id;
    segmentPolylines[k].forEach(pl => {
      pl.setStyle(isTarget ? { weight: 5, opacity: 1 } : { weight: 2, opacity: 0.2 });
      if (isTarget) pl.bringToFront();
    });
  });
  document.querySelectorAll('.seg').forEach(el => {
    el.classList.toggle('seg-hl', parseInt(el.dataset.id) === id);
  });
}

function highlightStage(segId, stageIdx) {
  _clearStageOverlays();
  const id = parseInt(segId);
  // Dim all segment lines
  Object.keys(segmentPolylines).forEach(k => {
    segmentPolylines[k].forEach(pl => pl.setStyle({ weight: 2, opacity: 0.15 }));
  });
  // Show only the target stage overlay
  if (stagePolylines[id] && stagePolylines[id][stageIdx]) {
    stagePolylines[id][stageIdx].setStyle({ opacity: 1 });
    stagePolylines[id][stageIdx].bringToFront();
  }
  document.querySelectorAll('.seg').forEach(el => {
    el.classList.toggle('seg-hl', parseInt(el.dataset.id) === id);
  });
}

function unhighlightAll() {
  _clearStageOverlays();
  Object.keys(segmentPolylines).forEach(k => {
    segmentPolylines[k].forEach(pl => pl.setStyle({ weight: 3, opacity: 0.8 }));
  });
  document.querySelectorAll('.seg').forEach(el => el.classList.remove('seg-hl'));
}

// Find the index in a lat/lng array closest to a given coordinate
function closestRouteIdx(route, lat, lng) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < route.length; i++) {
    const d = (route[i][0] - lat) ** 2 + (route[i][1] - lng) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// Strip known non-city prefixes ("Ferry: X → Y" → "X → Y", "Åland: X" → "X")
function cleanStageName(name) {
  return name.replace(/^[^:]+:\s*/, '').trim();
}

// Match a city name against the waypoints array (case-insensitive, prefix-tolerant)
function wpByName(name, waypoints) {
  const n = name.trim().toLowerCase();
  return waypoints.find(wp => {
    const w = wp.name.toLowerCase();
    return w === n || w.startsWith(n) || n.startsWith(w);
  });
}

function buildStagePolylines(segId, fullLatLngs) {
  const seg = segments.find(s => s.id == segId);
  if (!seg || !seg.stages || fullLatLngs.length < 2) return;
  if (stagePolylines[segId]) {
    stagePolylines[segId].forEach(pl => { if (pl && layerGroups[segId]) layerGroups[segId].removeLayer(pl); });
  }
  stagePolylines[segId] = [];
  const N = fullLatLngs.length;
  const stageDists = seg.stages.map(s => parseDistKm(s.dist));
  const totalDist = stageDists.reduce((a, b) => a + b, 0);

  seg.stages.forEach((stage, idx) => {
    // Strip label prefixes ("Ferry: A → B" → "A → B") then split on arrow
    const cleaned = cleanStageName(stage.name);
    const parts = cleaned.split('→').map(p => p.trim());
    const startWp = wpByName(parts[0], seg.waypoints);
    const endWp   = wpByName(parts[parts.length - 1], seg.waypoints);

    let slice;
    if (startWp && endWp && startWp !== endWp) {
      // Waypoint-based: snap to closest points in the route
      const i0 = closestRouteIdx(fullLatLngs, startWp.lat, startWp.lng);
      const i1 = closestRouteIdx(fullLatLngs, endWp.lat, endWp.lng);
      const lo = Math.min(i0, i1), hi = Math.max(i0, i1);
      slice = fullLatLngs.slice(lo, hi + 1);
    } else if (totalDist > 0) {
      // Proportional fallback when waypoints can't be found
      const before = stageDists.slice(0, idx).reduce((a, b) => a + b, 0);
      const i0 = Math.floor((before / totalDist) * N);
      const i1 = Math.min(N - 1, Math.ceil(((before + stageDists[idx]) / totalDist) * N));
      slice = fullLatLngs.slice(i0, i1 + 1);
    } else {
      stagePolylines[segId].push(null);
      return;
    }

    const pl = L.polyline(slice.length > 1 ? slice : fullLatLngs, {
      color: '#ffffff', weight: 5, opacity: 0, lineCap: 'round', lineJoin: 'round'
    }).addTo(layerGroups[segId]);
    stagePolylines[segId].push(pl);
  });
}

segments.forEach(seg => {
  const g = L.layerGroup().addTo(map);
  layerGroups[seg.id] = g;
  segmentPolylines[seg.id] = [];

  const _trackPl = (coords, style) => {
    if (!coords || coords.length < 2) return;
    const pl = L.polyline(coords, style).addTo(g);
    segmentPolylines[seg.id].push(pl);
    pl.on('mouseover', () => highlightSeg(seg.id));
    pl.on('mouseout', () => unhighlightAll());
  };
  if (seg.route && seg.route.length > 1) {
    const st = seg.transport==='train'
      ? {color:seg.color,weight:3,opacity:.8,dashArray:'10,8'}
      : {color:seg.color,weight:3,opacity:.8};
    _trackPl(seg.route, st);
  }
  _trackPl(seg.ferryRoute, {color:'#5eead4',weight:2.5,opacity:.7,dashArray:'6,10'});
  _trackPl(seg.bikeRoute2, {color:seg.color,weight:3,opacity:.8});
  _trackPl(seg.ferryRoute2, {color:'#5eead4',weight:2.5,opacity:.7,dashArray:'6,10'});
  _trackPl(seg.trainRoute, {color:'#a855f7',weight:3,opacity:.8,dashArray:'10,8'});
  _trackPl(seg.busRoute, {color:'#38bdf1',weight:3,opacity:.8,dashArray:'10,8'});

  seg.waypoints.forEach(wp => {
    const m = L.marker([wp.lat, wp.lng], {icon:mkIcon(seg.color, wp.type)}).addTo(g);
    const tl = wp.type==='start'?'Start':wp.type==='end'?'Finish':wp.type==='ferry'?'Ferry':wp.type==='train'?'Train':wp.type==='bus'?'Bus':'Stop';
    m.bindPopup(`<div class="pt" style="color:${seg.color}">${tl} &mdash; Seg ${seg.id}</div><b>${wp.name}</b>`);
  });

  if (seg.detours) {
    seg.detours.forEach(d => {
      if (d.lat && d.lng) {
        const dm = L.marker([d.lat, d.lng], {icon:mkDetourIcon()}).addTo(g);
        const vc = d.verdict==='must'?'#22c55e':d.verdict==='highly'?'#60a5fa':'#94a3b8';
        const vl = d.verdict==='must'?'MUST DO':d.verdict==='highly'?'HIGHLY RECOMMENDED':'NICE IF TIME';
        dm.bindPopup(`<div class="pt" style="color:#f59e0b">Detour &mdash; Seg ${seg.id}</div><b>${d.name}</b><br>${d.desc}<br><span style="font-weight:700;color:${vc};font-size:10px">${vl}</span> &bull; ${d.dist} &bull; ${d.time}`);
      }
    });
  }
});

// --- ELEVATION PROFILE ---
const elevationData = {};

function parseDistKm(distStr) {
  const m = distStr.match(/~?(\d+)\s*km/);
  return m ? parseInt(m[1]) : 60;
}

function getStageElevSlice(fullProfile, stageIdx, stageDists) {
  const total = stageDists.reduce((a, b) => a + b, 0);
  if (!total || !fullProfile.length) return [];
  const before = stageDists.slice(0, stageIdx).reduce((a, b) => a + b, 0);
  const N = fullProfile.length;
  const i0 = Math.floor((before / total) * N);
  const i1 = Math.min(N - 1, Math.ceil(((before + stageDists[stageIdx]) / total) * N));
  return fullProfile.slice(i0, i1 + 1);
}

function renderMiniElevChart(profile, distKm) {
  if (!profile || profile.length < 4) return '';
  const W = 340, H = 42, pT = 5, pB = 3;
  const cH = H - pT - pB;
  const step = Math.max(1, Math.floor(profile.length / 120));
  const pts = [];
  for (let i = 0; i < profile.length; i += step) pts.push(profile[i]);
  if (pts.length < 2) return '';
  const maxE = Math.max(...pts), minE = Math.min(...pts);
  const range = Math.max(maxE - minE, 8);
  const xs = pts.map((_, i) => (i / (pts.length - 1)) * W);
  const ys = pts.map(e => pT + cH - ((e - minE) / range) * cH);
  const line = pts.map((_, i) => `${xs[i].toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area = `0,${H - pB} ${line} ${W},${H - pB}`;
  let asc = 0;
  for (let i = 1; i < pts.length; i++) { const d = pts[i] - pts[i-1]; if (d > 0.5) asc += d; }
  asc = Math.round(asc);
  const terrain = distKm ? getTerrainClass(asc, distKm) : null;
  const badge = (terrain && terrain.cls !== 'tb-flat')
    ? `<span class="tbadge ${terrain.cls}" style="font-size:7px;padding:1px 5px;margin-left:5px">${terrain.label}</span>` : '';
  return `<div class="stage-elev">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" preserveAspectRatio="none">
      <polygon points="${area}" fill="rgba(59,130,246,.18)"/>
      <polyline points="${line}" fill="none" stroke="#60a5fa" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="3" y="${pT - 1}" fill="#3b4a61" font-size="6.5" font-family="system-ui,sans-serif">${maxE}m</text>
      <text x="3" y="${H - 1}" fill="#3b4a61" font-size="6.5" font-family="system-ui,sans-serif">${minE}m</text>
    </svg>
    <div style="display:flex;align-items:center;font-size:8.5px;color:#475569;margin-top:2px">
      <span>\u2191 ${asc}m ascent</span>${badge}
    </div>
  </div>`;
}

function renderStageCharts(segDiv, segId) {
  const data = elevationData[segId];
  if (!data || !data.profile || data.profile.length === 0) return;
  const seg = segments.find(s => s.id == segId);
  if (!seg || seg.transport !== 'bike') return;
  const stageEls = segDiv.querySelectorAll('.stage');
  const stageDists = seg.stages.map(s => parseDistKm(s.dist));
  stageEls.forEach((el, idx) => {
    if (el.querySelector('.stage-elev')) return;
    const slice = getStageElevSlice(data.profile, idx, stageDists);
    const html = renderMiniElevChart(slice, stageDists[idx]);
    if (html) el.insertAdjacentHTML('beforeend', html);
  });
}

function extractElevationFromGeojson(geojson) {
  const coords = geojson.features[0].geometry.coordinates;
  let ascent = 0, descent = 0, prev = null;
  const profile = [];
  coords.forEach(c => {
    const e = c[2];
    if (e === undefined || e === null) return;
    profile.push(e);
    if (prev !== null) {
      const d = e - prev;
      if (d > 0.5) ascent += d;
      else if (d < -0.5) descent += Math.abs(d);
    }
    prev = e;
  });
  const max = profile.length ? Math.round(Math.max(...profile)) : 0;
  const min = profile.length ? Math.round(Math.min(...profile)) : 0;
  return { profile, ascent: Math.round(ascent), descent: Math.round(descent), max, min };
}

function getTerrainClass(ascent, distKm) {
  if (!distKm) return { cls:'tb-flat', label:'Flat', note:null };
  const r = ascent / distKm;
  if (r < 5)  return { cls:'tb-flat',     label:'Flat',     note:null };
  if (r < 12) return { cls:'tb-rolling',  label:'Rolling',  note:'Gentle terrain — comfortable daily distances on the e-bike.' };
  if (r < 22) return { cls:'tb-hilly',    label:'Hilly',    note:'\u26A0 Significant climbing on this leg. Plan shorter day stages (60\u201380 km) and ensure the battery is fully charged each morning.' };
  return       { cls:'tb-mountain', label:'Mountain', note:'\u26A0 Tough mountain terrain. Plan 50\u201370 km days maximum. Start early, charge every opportunity, and carry the range extender. Battery range drops 30\u201340% on sustained climbs.' };
}

function renderElevationChart(container, segId) {
  const data = elevationData[segId];
  if (!data) { container.innerHTML = '<div class="elev-pending">Loading elevation data\u2026</div>'; return; }
  if (!data.profile || data.profile.length === 0) { container.innerHTML = '<div class="elev-pending">Elevation data unavailable for this segment</div>'; return; }
  const { profile, ascent, descent, max, min, distKm } = data;
  const terrain = getTerrainClass(ascent, distKm);
  const W = 360, H = 70, pT = 12, pB = 6, pL = 6, pR = 6;
  const cW = W - pL - pR, cH = H - pT - pB;
  const step = Math.max(1, Math.floor(profile.length / 250));
  const pts = [];
  for (let i = 0; i < profile.length; i += step) pts.push(profile[i]);
  const range = Math.max(max - min, 10);
  const xs = pts.map((_, i) => pL + (i / Math.max(pts.length - 1, 1)) * cW);
  const ys = pts.map(e => pT + cH - ((e - min) / range) * cH);
  const line = pts.map((_, i) => `${xs[i].toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area = `${pL},${H - pB} ` + line + ` ${xs[xs.length - 1].toFixed(1)},${H - pB}`;
  const gId = `eg${segId}`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;display:block;margin-bottom:2px" preserveAspectRatio="none">
    <defs><linearGradient id="${gId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity=".04"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#${gId})"/>
    <polyline points="${line}" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${pL}" y="${pT - 2}" fill="#475569" font-size="7" font-family="system-ui,sans-serif">${max}m</text>
    <text x="${pL}" y="${H - 1}" fill="#475569" font-size="7" font-family="system-ui,sans-serif">${min}m</text>
    ${distKm ? `<text x="${W - pR}" y="${H - 1}" fill="#475569" font-size="7" font-family="system-ui,sans-serif" text-anchor="end">${distKm} km</text>` : ''}
  </svg>`;
  const terrainNote = terrain.note ? `<div class="terrain-note">${terrain.note}</div>` : '';
  const gradientStr = distKm ? `<div class="elev-stat"><div class="ev">${Math.round(ascent / distKm)}m/km</div><div class="el">Avg Gradient</div></div>` : '';
  container.innerHTML = `
    <div class="elev-hdr"><span class="elev-label">Elevation Profile</span><span class="tbadge ${terrain.cls}">${terrain.label}</span></div>
    ${svg}
    <div class="elev-stats">
      <div class="elev-stat"><div class="ev">\u2191 ${ascent.toLocaleString()}m</div><div class="el">Total Ascent</div></div>
      <div class="elev-stat"><div class="ev">\u2193 ${descent.toLocaleString()}m</div><div class="el">Total Descent</div></div>
      <div class="elev-stat"><div class="ev">${max}m</div><div class="el">Max Altitude</div></div>
      ${gradientStr}
    </div>
    ${terrainNote}`;
}

    });

});

function findBestTrailRoute(from, to) {
  const forcedPalangaKlaipeda = getPalangaKlaipedaTrailRouteIfBothOnPath(from, to);

  if (forcedTalsiKuldiga) return forcedTalsiKuldiga;
  const forcedJurmalaTalsi = getJurmalaTalsiTrailRouteIfBothOnPath(from, to);
  if (forcedJurmalaTalsi) return forcedJurmalaTalsi;
  const forcedAinaziVilkumuiza = getAinaziVilkumuizaTrailRouteIfBothOnPath(from, to);
  if (forcedAinaziVilkumuiza) return forcedAinaziVilkumuiza;
  const forcedHaapsaluParnu = getHaapsaluParnuTrailRouteIfBothOnPath(from, to);
  if (forcedHaapsaluParnu) return forcedHaapsaluParnu;
  const forcedEstoniaHaapsalu = getEstoniaHaapsaluTrailRouteIfBothOnPath(from, to);
  if (forcedEstoniaHaapsalu) return forcedEstoniaHaapsalu;
  const forcedTallinnEstonia = getTallinnEstoniaTrailRouteIfBothOnPath(from, to);
  if (forcedTallinnEstonia) return forcedTallinnEstonia;
  const forcedTurkuSalo = getTurkuSaloTrailRouteIfBothOnPath(from, to);
  if (forcedTurkuSalo) return forcedTurkuSalo;
  const forcedSaloLohja = getSaloLohjaTrailRouteIfBothOnPath(from, to);
  if (forcedSaloLohja) return forcedSaloLohja;
  const forcedLohjaHelsinki = getLohjaHelsinkiTrailRouteIfBothOnPath(from, to);
  if (forcedLohjaHelsinki) return forcedLohjaHelsinki;
  const forcedEckeroMariehamn = getEckeroMariehamnTrailRouteIfBothOnPath(from, to);
  if (forcedEckeroMariehamn) return forcedEckeroMariehamn;
  const forcedEckeroCamp = getEckeroCampTrailRouteIfBothOnPath(from, to);
  if (forcedEckeroCamp) return forcedEckeroCamp;
  const forcedNorrtaljeGrisslehamn = getNorrtaljeGrisslehamnTrailRouteIfBothOnPath(from, to);
  if (forcedNorrtaljeGrisslehamn) return forcedNorrtaljeGrisslehamn;
  const forcedArchipelagoCamp = getArchipelagoCampTrailRouteIfBothOnPath(from, to);
  if (forcedArchipelagoCamp) return forcedArchipelagoCamp;
  const forcedStockholm = getStockholmTrailRouteIfBothOnPath(from, to);
  if (forcedStockholm) return forcedStockholm;
  const forcedSodertalje = getSodertaljeTrailRouteIfBothOnPath(from, to);
  if (forcedSodertalje) return forcedSodertalje;
  const forcedNykopingCamp = getNykopingCampTrailRouteIfBothOnPath(from, to);
  if (forcedNykopingCamp) return forcedNykopingCamp;
  const forcedNorrkopingCamp = getNorrkopingCampTrailRouteIfBothOnPath(from, to);
  if (forcedNorrkopingCamp) return forcedNorrkopingCamp;
  const forcedLinkopingNorrkoping = getLinkopingNorrkopingTrailRouteIfBothOnPath(from, to);
  if (forcedLinkopingNorrkoping) return forcedLinkopingNorrkoping;
  const forcedOdeshogLinkoping = getOdeshogLinkopingTrailRouteIfBothOnPath(from, to);
  if (forcedOdeshogLinkoping) return forcedOdeshogLinkoping;
  const forcedJonkoping = getJonkopingOdeshogTrailRouteIfBothOnPath(from, to);
  if (forcedJonkoping) return forcedJonkoping;
  const forced = getAlingsasTrailRouteIfBothOnPath(from, to);
  if (forced) return forced;
  let best = null;
  let bestScore = Infinity;
  getTrailBikeRoutes().forEach(function(route) {
    if (!shouldUseBikeRoute(from, to, route)) return;
    const fromNR = nearestOnRoute(route, from.lat, from.lng);
    const toNR = nearestOnRoute(route, to.lat, to.lng);
    const score = fromNR.dist + toNR.dist;
    if (score < bestScore) {
      bestScore = score;
      best = route;
    }
  });
  return best;
}

function getStageRouteLatLngs(segId, stageName) {
  const full = realRoutePolylines[segId];
  if (!full || full.length < 2) return null;
  const seg = segments.find(s => s.id == segId);
  if (!seg) return null;
  const cleaned = cleanStageName(stageName);
  const parts = cleaned.split('\u2192').map(p => p.trim());
  const startWp = wpByName(parts[0], seg.waypoints);
  const endWp = wpByName(parts[parts.length - 1], seg.waypoints);
  if (!startWp || !endWp) return null;
  const i0 = closestRouteIdx(full, startWp.lat, startWp.lng);
  const i1 = closestRouteIdx(full, endWp.lat, endWp.lng);
  const lo = Math.min(i0, i1), hi = Math.max(i0, i1);
  const slice = full.slice(lo, hi + 1);
  return slice.length > 1 ? slice : null;
}

function routeMidpoint(latlngs) {
  if (!latlngs || latlngs.length < 2) return latlngs ? latlngs[0] : null;
  let total = 0;
  const segLens = [];
  for (let i = 1; i < latlngs.length; i++) {
    const dlat = latlngs[i][0] - latlngs[i - 1][0];
    const dlng = latlngs[i][1] - latlngs[i - 1][1];
    const d = Math.sqrt(dlat * dlat + dlng * dlng);
    segLens.push(d);
    total += d;
  }
  if (!total) return latlngs[Math.floor(latlngs.length / 2)];
  let half = total / 2;
  for (let i = 0; i < segLens.length; i++) {
    if (half <= segLens[i]) {
      const t = half / segLens[i];
      return [
        latlngs[i][0] + t * (latlngs[i + 1][0] - latlngs[i][0]),
        latlngs[i][1] + t * (latlngs[i + 1][1] - latlngs[i][1])
      ];
    }
    half -= segLens[i];
  }
  return latlngs[latlngs.length - 1];
}

function isUkCheckin(h) {
  return h.lat >= 49 && h.lat <= 59 && h.lng >= -8 && h.lng <= 2;
}

function isPreTripCheckin(h) {
  // Perth Airport and southen hemisphere (Australia)
  if (h.lat < 0) return true;
  // Vietnam / SE Asia layover
  if (h.lat >= 0 && h.lat <= 25 && h.lng >= 95 && h.lng <= 115) return true;
  // UK pre-departure (before the bike trip started in Gothenburg)
  if (isUkCheckin(h)) return true;
  return false;
}

function isAlandCheckin(h) {
  return h.lat >= 59.7 && h.lat <= 60.5 && h.lng >= 19.3 && h.lng <= 21.5;
}

function isKokarCheckin(h) {
  return h.lat >= 59.7 && h.lat <= 60.2 && h.lng >= 20.5 && h.lng <= 21.5;
}

function isSwedenCheckin(h) {
  return h.lat >= 55 && h.lng >= 10 && h.lng <= 24 && !isAlandCheckin(h);
}

function isAlandOrFinlandCheckin(h) {
  return h.lat >= 59.5 && h.lng >= 19 && h.lng <= 32;
}

function isEstoniaCheckin(h) {
  return h.lat >= 57.5 && h.lat < 59.8 && h.lng >= 21.5 && h.lng <= 28.5;
}

function trailNoteText(from, to) {
  // Only the arrival ("to") entry's note describes how that leg was travelled.
  // Never mix in the "from" entry's note — it describes the leg before this one
  // and can contain unrelated transport words (e.g. "...by train") that would
  // otherwise leak into this leg's classification.
  return ((to && to.note) || '');
}

function isTrainTrailLeg(from, to) {
  if (to && to.transport === 'train') return true;
  if (to && to.transport && to.transport !== 'train') return false;
  const note = trailNoteText(from, to).toLowerCase();
  if (note.indexOf('by train') !== -1) return true;
  const fromLoc = ((from && from.location) || '').toLowerCase();
  const toLoc = ((to && to.location) || '').toLowerCase();
  return fromLoc.indexOf('klaip') !== -1 && toLoc.indexOf('vilnius') !== -1;
}

function isBusTrailLeg(from, to) {
  if (to && to.transport === 'bus') return true;
  if (to && to.transport && to.transport !== 'bus') return false;
  const note = trailNoteText(from, to).toLowerCase();
  if (note.indexOf('by overnight bus') !== -1 || note.indexOf('by bus') !== -1) return true;
  const fromLoc = ((from && from.location) || '').toLowerCase();
  const toLoc = ((to && to.location) || '').toLowerCase();
  return fromLoc.indexOf('vilnius') !== -1 && (toLoc.indexOf('warsaw') !== -1 || toLoc.indexOf('warszawa') !== -1);
}

const TRAIL_ON_ROUTE_DEG = 0.004;      // ~400 m — on the cycling path
const TRAIL_ROUTE_CORRIDOR_DEG = 0.15; // ~15 km — still snap to the planned route

function distDeg(lat1, lng1, lat2, lng2) {
  const dlat = lat1 - lat2, dlng = lng1 - lng2;
  return Math.sqrt(dlat * dlat + dlng * dlng);
}

function nearestOnRoute(route, lat, lng) {
  const idx = closestRouteIdx(route, lat, lng);
  return { idx: idx, pt: route[idx], dist: distDeg(route[idx][0], route[idx][1], lat, lng) };
}

function appendPathPoints(path, pts) {
  pts.forEach(function(pt) {
    const last = path[path.length - 1];
    if (!last || last[0] !== pt[0] || last[1] !== pt[1]) path.push(pt);
  });
}

function buildPathAlongRoute(fromPt, toPt, route) {
  const fromNR = nearestOnRoute(route, fromPt[0], fromPt[1]);
  const toNR = nearestOnRoute(route, toPt[0], toPt[1]);
  const fromOff = fromNR.dist > TRAIL_ON_ROUTE_DEG;
  const toOff = toNR.dist > TRAIL_ON_ROUTE_DEG;
  const path = [];

  if (fromOff) appendPathPoints(path, [fromPt, fromNR.pt]);
  else appendPathPoints(path, [fromPt]);

  const lo = Math.min(fromNR.idx, toNR.idx);
  const hi = Math.max(fromNR.idx, toNR.idx);
  const routeSlice = route.slice(lo, hi + 1);
  appendPathPoints(path, fromNR.idx <= toNR.idx ? routeSlice : routeSlice.slice().reverse());

  if (toOff) appendPathPoints(path, [toNR.pt, toPt]);
  else if (path[path.length - 1][0] !== toPt[0] || path[path.length - 1][1] !== toPt[1]) {
    appendPathPoints(path, [toPt]);
  }
  return path;
}

function shouldUseBikeRoute(from, to, route) {
  if (!route || route.length < 2) return false;
  const fromNR = nearestOnRoute(route, from.lat, from.lng);
  const toNR = nearestOnRoute(route, to.lat, to.lng);
  return fromNR.dist <= TRAIL_ROUTE_CORRIDOR_DEG && toNR.dist <= TRAIL_ROUTE_CORRIDOR_DEG;
}

function buildTrailSegmentPaths(chronological) {
  const bikePaths = [];
  const ferryPaths = [];
  const trainPaths = [];
  const busPaths = [];
  const gbgRoute = getGothenburgAlingsasTrailRoute();
  for (let i = 0; i < chronological.length - 1; i++) {
    const from = chronological[i];
    const to = chronological[i + 1];
    if (from.pinIcon === 'skull') continue;
    if (distDeg(from.lat, from.lng, to.lat, to.lng) < 0.00002) continue;
    const fromPt = [from.lat, from.lng];
    const toPt = [to.lat, to.lng];

    if (isPreTripCheckin(from) && isPreTripCheckin(to)) {
      continue; // Perth → Vietnam → London: no line
    } else if (isUkCheckin(from) && isSwedenCheckin(to)) {
      // London → Gothenburg flight: skip the flight line, just start the bike route from Gothenburg
      if (gbgRoute && gbgRoute.length > 1) {
        bikePaths.push(buildPathAlongRoute(GOTHENBURG_LATLNG, toPt, gbgRoute));
      } else {
        bikePaths.push([GOTHENBURG_LATLNG, toPt]);
      }
    } else if (isAlandCheckin(from) && isKokarCheckin(to)) {
      // Mariehamn area → Långnäs by bike, ferry to Kökar (Hellsö), bike to camp
      const toMarieLangnas = trailBikeRoutes.mariehamnLangnas;
      const toHellsoKamp = trailBikeRoutes.hellsoKokarCamp;
      if (toMarieLangnas && toMarieLangnas.length > 1) {
        bikePaths.push(buildPathAlongRoute(fromPt, LANGNÄS_LATLNG, toMarieLangnas));
      } else {
        bikePaths.push([fromPt, LANGNÄS_LATLNG]);
      }
      ferryPaths.push(LANGNÄS_HELLSO_FERRY_ROUTE);
      if (toHellsoKamp && toHellsoKamp.length > 1) {
        bikePaths.push(buildPathAlongRoute(HELLSO_KOKAR_LATLNG, toPt, toHellsoKamp));
      } else {
        bikePaths.push([HELLSO_KOKAR_LATLNG, toPt]);
      }
    } else if (isAlandOrFinlandCheckin(from) && isAlandOrFinlandCheckin(to)) {
      const bikeRoute = findBestTrailRoute(from, to);
      if (bikeRoute) bikePaths.push(buildPathAlongRoute(fromPt, toPt, bikeRoute));
      else bikePaths.push([fromPt, toPt]);
    } else if (isSwedenCheckin(from) && isAlandOrFinlandCheckin(to)) {
      const toGriss = trailBikeRoutes.norrtaljeGrisslehamn;
      const toCamp = trailBikeRoutes.eckeroCamp;
      if (toGriss && toGriss.length > 1) {
        bikePaths.push(buildPathAlongRoute(fromPt, GRISSLEHAMN_LATLNG, toGriss));
      } else {
        bikePaths.push([fromPt, GRISSLEHAMN_LATLNG]);
      }
      ferryPaths.push(GRISSLEHAMN_ECKERO_FERRY_ROUTE);
      if (toCamp && toCamp.length > 1) {
        bikePaths.push(buildPathAlongRoute(ECKERO_FERRY_LATLNG, toPt, toCamp));
      } else {
        bikePaths.push([ECKERO_FERRY_LATLNG, toPt]);
      }
    } else if (isSwedenCheckin(from) && isSwedenCheckin(to)) {
      const bikeRoute = findBestTrailRoute(from, to);
      if (bikeRoute) bikePaths.push(buildPathAlongRoute(fromPt, toPt, bikeRoute));
      else bikePaths.push([fromPt, toPt]);
    } else if (isAlandOrFinlandCheckin(from) && isEstoniaCheckin(to)) {
      // Helsinki → Tallinn ferry — draw as ferry line, no cycling segment
      ferryPaths.push([fromPt, toPt]);
    } else if (isEstoniaCheckin(from) && isEstoniaCheckin(to)) {
      // Estonia cycling — use pre-cached route or OSRM fallback
      const bikeRoute = findBestTrailRoute(from, to);
      if (bikeRoute) bikePaths.push(buildPathAlongRoute(fromPt, toPt, bikeRoute));
      else bikePaths.push([fromPt, toPt]);
    } else if (isTrainTrailLeg(from, to)) {
      trainPaths.push({
        path: [fromPt, toPt],
        label: ((from.location || 'Train') + ' \u2192 ' + (to.location || '')).replace(/,\s*[^,]+$/, '') || 'Train'
      });
    } else if (isBusTrailLeg(from, to)) {
      busPaths.push({
        path: [fromPt, toPt],
        label: ((from.location || 'Bus') + ' \u2192 ' + (to.location || '')).replace(/,\s*[^,]+$/, '') || 'Bus'
      });
    } else if (isPreTripCheckin(from) || isPreTripCheckin(to)) {
      continue; // suppress any line touching a pre-trip pin
    } else {
      const bikeRoute = findBestTrailRoute(from, to);
      if (bikeRoute) bikePaths.push(buildPathAlongRoute(fromPt, toPt, bikeRoute));
      else bikePaths.push([fromPt, toPt]);
    }
  }
  const osrmSegments = [];
  const routedBikePaths = [];
  bikePaths.forEach(function(path) {
    if (path.length === 2 && distDeg(path[0][0], path[0][1], path[1][0], path[1][1]) > 0.008) {
      osrmSegments.push(path);
    } else {
      routedBikePaths.push(path);
    }
  });
  return {
    bikePaths: routedBikePaths,
    ferryPaths: ferryPaths,
    trainPaths: trainPaths,
    busPaths: busPaths,
    osrmSegments: osrmSegments
  };
}

function photoLatLng(p) {
  if (p.location === 'Gothenburg \u2192 Alings\u00e5s') {
    const route = getGothenburgAlingsasTrailRoute();
    const mid = route ? routeMidpoint(route) : null;
    if (mid) return mid;
  }
  if (p.lat != null && p.lng != null) return [p.lat, p.lng];
  return null;
}

async function fetchBRouterRoute(coordString) {
  const url = `https://brouter.de/brouter?lonlats=${coordString}&profile=fastbike-lowtraffic&alternativeidx=0&format=geojson`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`BRouter ${resp.status}`);
  return resp.json();
}

function geojsonToLatLngs(geojson) {
  const coords = geojson.features[0].geometry.coordinates;
  return coords.map(c => [c[1], c[0]]);
}

function getRouteDistance(geojson) {
  return Number(geojson.features[0].properties['track-length']) || 0;
}

async function loadRealRoutes() {
  const statusEl = document.createElement('div');
  statusEl.id = 'route-status';
  statusEl.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#1e293b;color:#60a5fa;padding:8px 16px;border-radius:8px;font-size:11px;font-family:Segoe UI,system-ui,sans-serif;z-index:1000;border:1px solid #334155;box-shadow:0 4px 12px rgba(0,0,0,.5)';
  document.body.appendChild(statusEl);

  let totalRealKm = 0;
  let loadedCount = 0;
  const segIds = Object.keys(routingSegments).filter(k => routingSegments[k]);

  for (const segId of segIds) {
    const rd = routingSegments[segId];
    if (!rd) continue;
    const seg = segments.find(s => s.id == segId);
    if (!seg) continue;

    statusEl.textContent = `Calculating real cycling route: Segment ${segId}/${segments.length}...`;
    let segDistM = 0;
    const segLatLngs = [];

    for (const part of rd.parts) {
      if (part.type !== 'bike') continue;
      try {
        const geojson = await fetchBRouterRoute(part.coords);
        const latlngs = geojsonToLatLngs(geojson);
        const distM = getRouteDistance(geojson);
        segDistM += distM;
        segLatLngs.push(latlngs);
        // Extract elevation profile for this part
        const ep = extractElevationFromGeojson(geojson);
        if (!elevationData[segId]) elevationData[segId] = { profile:[], ascent:0, descent:0, max:-Infinity, min:Infinity, distKm:0 };
        const ed = elevationData[segId];
        ed.profile = ed.profile.concat(ep.profile);
        ed.ascent += ep.ascent;
        ed.descent += ep.descent;
        if (ep.max > ed.max) ed.max = ep.max;
        if (ep.min < ed.min) ed.min = ep.min;
      } catch (e) {
        console.warn(`BRouter failed for seg ${segId}:`, e);
      }
      await new Promise(r => setTimeout(r, 800));
    }

    if (segLatLngs.length > 0) {
      const flatRoute = segLatLngs.flat();
      realRoutePolylines[segId] = flatRoute;
      if (segId == 1 && !trailBikeRoutes.gothenburgAlingsas) {
        const stageRoute = getStageRouteLatLngs(1, 'Gothenburg \u2192 Alings\u00e5s');
        if (stageRoute) trailBikeRoutes.gothenburgAlingsas = stageRoute;
      }
      const group = layerGroups[segId];
      if (group) {
        group.eachLayer(l => {
          if (l instanceof L.Polyline && !(l.options.dashArray)) group.removeLayer(l);
        });
        // Keep only dashed (train/ferry) in tracking; solid estimated lines are gone
        segmentPolylines[segId] = (segmentPolylines[segId] || []).filter(pl => pl.options.dashArray);
        segLatLngs.forEach(ll => {
          const pl = L.polyline(ll, { color: seg.color, weight: 3, opacity: 0.85 }).addTo(group);
          segmentPolylines[segId].push(pl);
          pl.on('mouseover', () => highlightSeg(segId));
          pl.on('mouseout', () => unhighlightAll());
        });
        // Rebuild stage overlays with accurate GPS geometry
        buildStagePolylines(segId, flatRoute);
      }

      if (segId == 1) {
        if (trailBikeRoutes.gothenburgAlingsas) {
          rebuildPhotoLayer();
          rebuildTrailLayer();
        }
        overlayActualStage2Route();
      }

      const km = Math.round(segDistM / 1000);
      totalRealKm += km;
      realDistances[segId] = km;

      // Finalise elevation distance and refresh chart if segment is open
      if (elevationData[segId]) {
        elevationData[segId].distKm = km;
        const activeEc = document.querySelector(`.seg[data-id="${segId}"].active .elev-container`);
        if (activeEc) renderElevationChart(activeEc, segId);
        const activeSegDiv = document.querySelector(`.seg[data-id="${segId}"].active`);
        if (activeSegDiv) renderStageCharts(activeSegDiv, segId);
      }

      const segEl = document.querySelector(`.seg[data-id="${segId}"]`);
      if (segEl) {
        const distSpan = segEl.querySelector('.seg-meta');
        if (distSpan) {
          const spans = distSpan.querySelectorAll('span:not(.badge)');
          if (spans.length > 0) spans[0].textContent = `${km} km (GPS)`;
        }
      }
      loadedCount++;
    }
  }

  if (totalRealKm > 0) {
    rebuildPhotoLayer();
    rebuildTrailLayer();
    statusEl.innerHTML = `<span style="color:#22c55e;font-weight:700">GPS routes loaded</span> &mdash; ${loadedCount} segments, ${totalRealKm.toLocaleString()} km total cycling distance`;
    setTimeout(() => { statusEl.style.opacity = '0'; statusEl.style.transition = 'opacity 2s'; setTimeout(() => statusEl.remove(), 2000); }, 6000);
  } else {
    statusEl.textContent = 'Route calculation unavailable \u2014 showing estimated routes';
    setTimeout(() => statusEl.remove(), 4000);
  }
}

function sortedTripPhotos(photos) {
  return photos.filter(function(p) { return mediaPinSrc(p) || mediaVideoSrc(p); }).slice().sort(function(a, b) {
    return photoTripSortKey(a) - photoTripSortKey(b);
  });
}

function photoPathToThumb(path) {
  if (!path) return path;
  if (path.indexOf('/thumbs/') !== -1) return path;
  return path.replace(/^(photos\/)/, 'photos/thumbs/');
}

function mediaFullSrc(p) {
  return p.src || null;
}

function mediaThumbSrc(p) {
  if (p.thumb) return p.thumb;
  var base = p.poster || p.src;
  if (!base) return null;
  if (/\.(mp4|webm)(\?|$)/i.test(base)) {
    return p.poster ? mediaThumbSrc({ src: p.poster }) : null;
  }
  if (base.indexOf('/thumbs/') !== -1) return base;
  return base.replace(/^(photos\/)/, 'photos/thumbs/');
}

function mediaPinSrc(p) {
  return mediaThumbSrc(p) || p.poster || p.src;
}

function mediaVideoSrc(p) {
  return p.video || ((/\.(mp4|webm)(\?|$)/i.test(p.src || '')) ? p.src : null);
}

function enforceMutedMedia(el) {
  if (!el) return;
  el.muted = true;
  el.volume = 0;
  el.setAttribute('muted', '');
  if (!el.dataset.muteLocked) {
    el.dataset.muteLocked = '1';
    el.addEventListener('volumechange', function() {
      el.muted = true;
      el.volume = 0;
    });
  }
}

function lbOpen(idx) {
  lbPhotos = sortedTripPhotos(tripStatus.photos || []);
  if (!lbPhotos.length) return;
  lbIndex = ((idx % lbPhotos.length) + lbPhotos.length) % lbPhotos.length;
  lbRender();
  document.getElementById('photo-lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function lbClose() {
  var vid = document.getElementById('lb-video');
  vid.pause();
  vid.removeAttribute('src');
  vid.load();
  document.getElementById('photo-lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function lbRender() {
  var p = lbPhotos[lbIndex];
  var img = document.getElementById('lb-img');
  var vid = document.getElementById('lb-video');
  var videoSrc = mediaVideoSrc(p);
  if (videoSrc) {
    img.style.display = 'none';
    vid.style.display = 'block';
    enforceMutedMedia(vid);
    if (vid.getAttribute('src') !== videoSrc) {
      vid.setAttribute('src', videoSrc);
      vid.load();
    }
    enforceMutedMedia(vid);
    vid.poster = mediaPinSrc(p) || '';
  } else {
    vid.pause();
    vid.style.display = 'none';
    vid.removeAttribute('src');
    img.style.display = 'block';
    img.src = mediaFullSrc(p) || mediaPinSrc(p);
    img.alt = p.caption || '';
  }
  document.getElementById('lb-caption').textContent = p.caption || '';
  document.getElementById('lb-location').textContent = p.location || '';
  document.getElementById('lb-counter').textContent = (lbIndex + 1) + ' / ' + lbPhotos.length;
  document.getElementById('lb-prev').classList.toggle('hidden', lbPhotos.length <= 1);
  document.getElementById('lb-next').classList.toggle('hidden', lbPhotos.length <= 1);
  if (p.lat && p.lng) map.flyTo([p.lat, p.lng], 15, { animate: true, duration: 0.8 });
}

function lbGo(dir) {
  var vid = document.getElementById('lb-video');
  vid.pause();
  var next = lbIndex + dir;
  if (next < 0 || next >= lbPhotos.length) return;
  lbIndex = next;
  lbRender();
}

document.getElementById('lb-close').addEventListener('click', lbClose);
document.getElementById('lb-prev').addEventListener('click', function(){ lbGo(-1); });
document.getElementById('lb-next').addEventListener('click', function(){ lbGo(1); });

document.addEventListener('keydown', function(e) {
  if (!document.getElementById('photo-lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowLeft') lbGo(-1);
  if (e.key === 'ArrowRight') lbGo(1);
});

(function() {
  var el = document.getElementById('photo-lightbox');

    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;

})();

const trailGroup = L.layerGroup();
const trailOsrmCache = {};

function trailOsrmKey(fromPt, toPt) {
  return fromPt[0].toFixed(5) + ',' + fromPt[1].toFixed(5) + '|' + toPt[0].toFixed(5) + ',' + toPt[1].toFixed(5);
}

function fetchOsrmBikePath(fromPt, toPt) {
  const key = trailOsrmKey(fromPt, toPt);
  if (trailOsrmCache[key]) return Promise.resolve(trailOsrmCache[key]);
  const url = 'https://router.project-osrm.org/route/v1/bicycle/' +
    fromPt[1] + ',' + fromPt[0] + ';' + toPt[1] + ',' + toPt[0] +
    '?overview=full&geometries=geojson';
  return fetch(url).then(function(resp) { return resp.ok ? resp.json() : null; }).then(function(data) {
    if (!data || !data.routes || !data.routes[0]) return null;
    const path = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
    if (path.length > 1) trailOsrmCache[key] = path;
    return path;
  }).catch(function() { return null; });
}

function addTrailBikePolyline(path) {
  if (!path || path.length < 2) return;
  L.polyline(path, {
    color: '#22c55e', weight: 3, opacity: 0.75, dashArray: '6,8', lineCap: 'round',
    pane: 'trailPane'
  }).addTo(trailGroup);
}

function formatTimelineWhen(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var date = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  var time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return date + ' \u00b7 ' + time;
}
function rebuildTrailLayer() {
  trailGroup.clearLayers();
  var history = (tripStatus.locationHistory || []).slice().filter(function(h){ return h.lat != null && h.lng != null; });
  if (!history.length) return;
  var chronological = history.slice().reverse();
  if (chronological.length > 1) {
    const trailPaths = buildTrailSegmentPaths(chronological);
    trailPaths.bikePaths.forEach(addTrailBikePolyline);
    trailPaths.ferryPaths.forEach(function(path) {
      if (path.length > 1) {
        L.polyline(path, {
          color: '#5eead4', weight: 3, opacity: 0.8, dashArray: '6,10', lineCap: 'round',
          pane: 'trailPane'
        }).bindPopup('<b>Ferry</b>')
          .addTo(trailGroup);
      }
    });
    (trailPaths.trainPaths || []).forEach(function(seg) {
      var path = seg.path || seg;
      var label = seg.label || 'Train';
      if (path.length > 1) {
        L.polyline(path, {
          color: '#a855f7', weight: 3, opacity: 0.85, dashArray: '10,8', lineCap: 'round',
          pane: 'trailPane'
        }).bindPopup('<b>' + label + '</b><br><span style="font-size:10px;color:#94a3b8">Train</span>')
          .addTo(trailGroup);
      }
    });
    (trailPaths.busPaths || []).forEach(function(seg) {
      var path = seg.path || seg;
      var label = seg.label || 'Bus';
      if (path.length > 1) {
        L.polyline(path, {
          color: '#38bdf1', weight: 3, opacity: 0.85, dashArray: '10,8', lineCap: 'round',
          pane: 'trailPane'
        }).bindPopup('<b>' + label + '</b><br><span style="font-size:10px;color:#94a3b8">Bus</span>')
          .addTo(trailGroup);
      }
    });
    (trailPaths.osrmSegments || []).forEach(function(path) {
      fetchOsrmBikePath(path[0], path[1]).then(function(osrmPath) {
        addTrailBikePolyline(osrmPath && osrmPath.length > 1 ? osrmPath : path);
      });
    });
  }
  chronological.forEach(function(h, idx) {
    var isLatest = idx === chronological.length - 1;
    var isSkull = h.pinIcon === 'skull';
    var isAngel = h.pinIcon === 'angel';
    var isEmojiPin = isSkull || isAngel;
    var emojiPin = isSkull ? '💀' : isAngel ? '😇' : '';
    var icon = L.divIcon({
      className: '',
      html: isEmojiPin
        ? '<div class="trail-pin-' + h.pinIcon + '">' + emojiPin + '</div>'
        : '<div class="' + (isLatest ? 'trail-pin-latest' : 'trail-pin') + '"></div>',
      iconSize: isEmojiPin ? [22, 22] : (isLatest ? [12, 12] : [10, 10]),
      iconAnchor: isEmojiPin ? [11, 11] : (isLatest ? [6, 6] : [5, 5])
    });
    var label = h.location || (h.lat + ', ' + h.lng);
    var pinColor = isSkull ? '#f97316' : isAngel ? '#fbbf24' : '#4ade80';
    var pinLabel = isSkull ? '💀 Stacked' : isAngel ? '😇 Back on the bike' : (isLatest ? '\u25CF Latest' : 'Check-in');
    var popup = '<div class="pt" style="color:' + pinColor + '">' + pinLabel + '</div>' +
      '<b>' + label + '</b><br>' +
      '<span style="font-size:10px;color:#64748b">' + formatTimelineWhen(h.at) + '</span>';
    if (h.note) popup += '<br><span style="font-size:10px;color:#94a3b8">' + h.note + '</span>';
    var m = L.marker([h.lat, h.lng], { icon: icon, zIndexOffset: isEmojiPin ? 800 : (isLatest ? 900 : 500 + idx) });
    m.bindPopup(popup);
    m.addTo(trailGroup);
    if (isSkull && h.uberTo && h.uberTo.length === 2) {
      L.polyline([[h.lat, h.lng], h.uberTo], {
        color: '#f97316', weight: 3, opacity: 0.8, dashArray: '4,7', lineCap: 'round',
        pane: 'trailPane'
      }).bindPopup('<b>Uber to hotel</b><br><span style="font-size:10px;color:#94a3b8">Jönköping</span>')
        .addTo(trailGroup);
    }
  });
}

function initTripStatus() {
  if (!tripHasProgress()) return;

  var finished = !!tripStatus.finished;

  // Status banner
  var banner = document.getElementById('trip-status-banner');
  banner.style.display = 'block';
  var segName = '';
  var curSeg = segments.find(function(s){ return s.id === tripStatus.currentSegment; });
  if (curSeg) segName = curSeg.title;
  var lastUpd = tripStatus.lastUpdated ? ' \u00b7 Updated ' + tripStatus.lastUpdated : '';
  var badge = finished
    ? '<span class="tb-badge tb-finished">Finished</span>'
    : '<span class="tb-badge">\u25CF Live</span>';
  banner.innerHTML =
    '<div class="trip-banner">' +
    '<div class="tb-top">' + badge + '<span class="tb-city">' + tripStatus.currentCity + '</span></div>' +
    '<div class="tb-sub">Day ' + tripStatus.dayNumber + (segName ? ' \u00b7 ' + segName : '') +
    (tripStatus.countries.length ? ' \u00b7 ' + tripStatus.countries.join(', ') : '') + lastUpd + '</div>' +
    '</div>';

  // Live stats bar
  var statsWrap = document.getElementById('live-stats-wrap');
  statsWrap.style.display = 'block';
  statsWrap.innerHTML =
    '<div class="live-stats">' +
    '<div class="live-stat"><div class="ls-val">' + tripStatus.kmRidden.toLocaleString() + '</div><div class="ls-lbl">km ridden</div></div>' +
    '<div class="live-stat"><div class="ls-val">' + tripStatus.dayNumber + '</div><div class="ls-lbl">day</div></div>' +
    '<div class="live-stat"><div class="ls-val">' + (tripStatus.countries.length||0) + '</div><div class="ls-lbl">countries</div></div>' +
    '</div>';

  // Progress bar
  var progWrap = document.getElementById('live-prog-wrap');
  progWrap.style.display = 'block';
  if (finished) {
    progWrap.innerHTML =
      '<div class="prog-wrap">' +
      '<div class="prog-lbl"><span>Trip complete</span><span>' + tripStatus.kmRidden.toLocaleString() + ' km</span></div>' +
      '<div class="prog-track"><div class="prog-fill" style="width:100%"></div></div>' +
      '</div>';
  } else {
    var pct = Math.round((tripStatus.kmRidden / TRIP_TOTAL_KM) * 100);
    pct = Math.min(pct, 100);
    progWrap.innerHTML =
      '<div class="prog-wrap">' +
      '<div class="prog-lbl"><span>Trip progress</span><span>' + pct + '% \u00b7 ' + Math.max(0, TRIP_TOTAL_KM - tripStatus.kmRidden) + ' km remaining</span></div>' +
      '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
  }

  // Updates feed
  renderUpdatesFeed();

  // Map marker
  var pinLat = tripStatus.lat;
  var pinLng = tripStatus.lng;
  if (!pinLat && curSeg) {
    var wp = curSeg.waypoints.find(function(w){ return w.name.toLowerCase().indexOf(tripStatus.currentCity.toLowerCase()) !== -1; });
    if (wp) { pinLat = wp.lat; pinLng = wp.lng; }
    else if (curSeg.waypoints.length) { pinLat = curSeg.waypoints[0].lat; pinLng = curSeg.waypoints[0].lng; }
  }
  if (pinLat && pinLng) {
    var yahIcon = L.divIcon({
      className: '',
      html: finished
        ? '<div class="yah-wrap yah-finished"><div class="yah-ring"></div><div class="yah-dot"></div></div>'
        : '<div class="yah-wrap"><div class="yah-ring"></div><div class="yah-dot"></div></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
    var yahMarker = L.marker([pinLat, pinLng], {icon: yahIcon, zIndexOffset: 1000});
    yahMarker.bindPopup(
      (finished
        ? '<div class="pt" style="color:#94a3b8">Ended here</div>'
        : '<div class="pt" style="color:#60a5fa">\u25CF You Are Here</div>') +
      '<b>' + tripStatus.currentCity + '</b><br>' +
      'Day ' + tripStatus.dayNumber + ' \u00b7 ' + tripStatus.kmRidden + ' km ridden'
    );
    yahMarker.addTo(map);
  }
}

function renderUpdatesFeed() {
  var wrap = document.getElementById('updates-feed-wrap');
  if (!wrap) return;
  var updates = tripStatus.updates || [];
  var countBadge = updates.length ? '<span class="u-count">' + updates.length + '</span>' : '';
  var bodyHtml = '';
  if (!updates.length) {
    bodyHtml = '<div class="updates-empty">No updates yet \u2014 check back once the trip starts!</div>';
  } else {
    bodyHtml = updates.map(function(u) {
      var photoHtml = u.photo ? '<div class="uc-img"><img src="' + u.photo + '" alt="" loading="lazy" decoding="async" onclick="window.open(\'' + u.photo + '\')"></div>' : '';
      return '<div class="update-card">' +
        '<div class="uc-meta"><span class="uc-date">' + u.date + '</span><span class="uc-loc">' + u.location + '</span></div>' +
        '<div class="uc-text">' + u.text + '</div>' +
        photoHtml +
        '</div>';
    }).join('');
  }
  wrap.innerHTML =
    '<div class="updates-section open">' +
    '<div class="updates-hdr" onclick="this.parentElement.classList.toggle(\'open\')">' +
    '<h3>&#x25CF; Journey Updates</h3>' + countBadge +
    '</div>' +
    '<div class="updates-body">' + bodyHtml + '</div>' +
    '</div>';
  wrap.querySelectorAll('.uc-map').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var lat = parseFloat(el.getAttribute('data-lat'));
      var lng = parseFloat(el.getAttribute('data-lng'));
      if (!isNaN(lat) && !isNaN(lng)) map.setView([lat, lng], 11, { animate: true });
    });
  });
}
