  // ---- Dead code kept for structure reference only ----
  function buildDockItems() {
    var items = [];
    // Journey updates (newest first)
    var updates = tripStatus.updates || [];
    updates.forEach(function (u, i) {
      items.push({ type: 'update', idx: i, date: u.date, title: u.location, sub: u.date, text: u.text, photo: u.photo || null, lat: u.lat || null, lng: u.lng || null, status: 'update' });
    });
    // Segments in route order
    segments.forEach(function (seg) {
      var st = segmentRideStatus(seg);
      var icon = seg.transport === 'train' ? '🚆' : seg.transport === 'ferry' ? '⛴' : '🚴';
      items.push({ type: 'segment', seg: seg, status: st, icon: icon });
    });
    return items;
  }

  function getNodeIcon(item) {
    if (item.type === 'update') {
      if (item.photo) return '<img class="dock-node-thumb" src="' + photoPathToThumb(item.photo) + '" alt="" loading="lazy" decoding="async">';
      return '<span class="dock-node-icon">📍</span>';
    }
    return '<span class="dock-node-icon">' + item.icon + '</span>';
  }

  function getNodeLabel(item) {
    if (item.type === 'update') return item.title;
    var seg = item.seg;
    var city = seg.waypoints && seg.waypoints.length ? seg.waypoints[0].name : seg.title;
    return city;
  }

  function addCloseBtn(inner) {
    var cb = document.createElement('div');
    cb.id = 'dock-detail-close';
    cb.innerHTML = '&#x2715;';
    cb.title = 'Close';
    cb.addEventListener('click', function () {
      document.getElementById('dock-detail').classList.add('collapsed');
      document.querySelectorAll('.dock-node').forEach(function (n) { n.classList.remove('selected'); });
      currentDockIdx = -1;
      unhighlightAll();
    });
    inner.insertBefore(cb, inner.firstChild);
  }

  function renderDetailUpdate(item) {
    var inner = document.getElementById('dock-detail-inner');
    var photoHtml = item.photo ? '<img class="dock-detail-photo" src="' + photoPathToThumb(item.photo) + '" alt="" loading="lazy" decoding="async" onclick="window.open(\'' + item.photo + '\')">' : '';
    inner.innerHTML = photoHtml +
      '<div class="dock-detail-meta">' +
        '<span class="dock-detail-badge update">Update</span>' +
        '<span class="dock-detail-date">' + (item.date || '') + '</span>' +
      '</div>' +
      '<div class="dock-detail-title">' + item.title + '</div>' +
      '<div class="dock-detail-body expanded">' + (item.text || '') + '</div>';
    addCloseBtn(inner);
    if (item.lat && item.lng) map.setView([item.lat, item.lng], 11, { animate: true });
  }

  function renderDetailSegment(item) {
    var inner = document.getElementById('dock-detail-inner');
    var seg = item.seg;
    var bc = seg.transport==='train'?'b-train':seg.transport==='ferry'?'b-ferry':'b-bike';
    var bt = seg.transport==='train'?'Train':seg.transport==='ferry'?'Ferry':'Cycling';

    var stagesHtml = '';
    if (seg.stages && seg.stages.length) {
      stagesHtml = '<div class="dock-stages"><div class="dock-stages-title">Stages</div>' +
        seg.stages.map(function (s) {
          var hiHtml = (s.highlights || []).map(function (h) {
            return '<li>' + h + '</li>';
          }).join('');
          return '<div class="dock-stage">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">' +
              '<span class="dock-stage-name">' + s.name + '</span>' +
              '<span class="dock-stage-dist">' + s.dist + '</span>' +
            '</div>' +
            '<div class="dock-stage-desc">' + s.desc + '</div>' +
            (hiHtml ? '<ul style="margin:5px 0 0 14px;padding:0;list-style:disc;font-size:10.5px;color:#64748b;line-height:1.6">' + hiHtml + '</ul>' : '') +
          '</div>';
        }).join('') + '</div>';
    }

    var detoursHtml = '';
    if (seg.detours && seg.detours.length) {
      var vc = function (d) { return d.verdict==='must'?'verdict-must':d.verdict==='highly'?'verdict-highly':'verdict-nice'; };
      var vl = function (d) { return d.verdict==='must'?'★ MUST DO':d.verdict==='highly'?'↑ HIGHLY RECOMMENDED':'◇ NICE IF TIME'; };
      detoursHtml = '<div class="dock-stages" style="margin-top:10px"><div class="dock-stages-title" style="color:#f59e0b">Recommended Detours</div>' +
        seg.detours.map(function (d) {
          return '<div class="detour-card">' +
            '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +
              '<span class="detour-name">' + d.name + '</span>' +
              '<span class="detour-meta">' + d.dist + ' · ' + d.time + '</span>' +
            '</div>' +
            '<div class="detour-desc">' + d.desc + '</div>' +
            '<div class="detour-verdict ' + vc(d) + '" style="margin-top:5px">' + vl(d) + '</div>' +
          '</div>';
        }).join('') + '</div>';
    }

    inner.innerHTML =
      '<div class="dock-detail-meta">' +
        '<span class="dock-detail-badge ' + item.status + '">' +
          (item.status === 'done' ? '✓ Done' : item.status === 'current' ? '● Here now' : 'Upcoming') +
        '</span>' +
        '<span class="badge ' + bc + '" style="font-size:9px">' + bt + '</span>' +
        '<span class="dock-detail-date">' + seg.distance + ' · ' + seg.days + '</span>' +
      '</div>' +
      '<div class="dock-detail-title">' + seg.title + '</div>' +
      '<div class="dock-detail-sub">' + (seg.routeName || '') + '</div>' +
      '<div class="dock-detail-body" id="dock-desc-body">' + (seg.description || '') + '</div>' +
      '<button class="dock-detail-more" id="dock-desc-more">Read more ▾</button>' +
      stagesHtml + detoursHtml +
      (seg.transport === 'bike' ? '<div class="elev-wrap"><div class="elev-container" id="dock-elev-container"><div class="elev-pending">Elevation data loads when routes are calculated…</div></div></div>' : '');
    addCloseBtn(inner);
    // Wire read-more toggle
    var descBody = inner.querySelector('#dock-desc-body');
    var descMore = inner.querySelector('#dock-desc-more');
    if (descMore && descBody) {
      descMore.addEventListener('click', function () {
        descBody.classList.toggle('expanded');
        descMore.textContent = descBody.classList.contains('expanded') ? 'Show less ▴' : 'Read more ▾';
      });
    }
    // Elevation chart
    var elevContainer = inner.querySelector('#dock-elev-container');
    if (elevContainer) {
      renderElevationChart(elevContainer, seg.id);
      // Also trigger route-based stage charts when route data arrives
      var segDiv = document.querySelector('.seg[data-seg="' + seg.id + '"]');
      if (segDiv) renderStageCharts(segDiv, seg.id);
    }

    // Fly map to segment bounds
    var bounds = [];
    seg.waypoints.forEach(function (wp) { bounds.push([wp.lat, wp.lng]); });
    if (seg.route) seg.route.forEach(function (p) { bounds.push(p); });
    if (bounds.length > 1) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 9, animate: true });
    else if (bounds.length === 1) map.setView(bounds[0], 8, { animate: true });
    highlightSeg(seg.id);
  }

  var currentDockIdx = -1;

  function selectDockNode(idx) {
    var items = buildDockItems();
    if (idx < 0 || idx >= items.length) return;
    currentDockIdx = idx;
    document.querySelectorAll('.dock-node').forEach(function (n, i) {
      n.classList.toggle('selected', i === idx);
    });
    var item = items[idx];
    var detail = document.getElementById('dock-detail');
    detail.classList.remove('collapsed');
    if (item.type === 'update') renderDetailUpdate(item);
    else renderDetailSegment(item);
    // Scroll node into view
    var nodes = document.querySelectorAll('.dock-node');
    if (nodes[idx]) nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  function initDock() {
    var items = buildDockItems();
    var track = document.getElementById('dock-track');
    if (!track) return;
    track.innerHTML = '';

    // Progress fill: fraction of segments done
    var totalSegs = segments.length;
    var doneSegs = tripStatus.finished
      ? segments.filter(function(s) { return s.id <= tripStatus.currentSegment; }).length
      : tripStatus.active ? Math.max(0, tripStatus.currentSegment - 1) : 0;
    var pct = totalSegs > 0 ? Math.round((doneSegs / totalSegs) * 100) : 0;
    var fill = document.getElementById('dock-progress-fill');
    if (fill) fill.style.width = pct + '%';

    items.forEach(function (item, idx) {
      var btn = document.createElement('button');
      btn.className = 'dock-node ' + item.status;
      btn.setAttribute('type', 'button');
      btn.innerHTML = '<div class="dock-node-ring">' + getNodeIcon(item) + '</div>' +
        '<div class="dock-node-label">' + getNodeLabel(item) + '</div>';
      btn.addEventListener('click', function () {
        if (currentDockIdx === idx) {
          // Tap selected node again → collapse detail
          document.getElementById('dock-detail').classList.add('collapsed');
          btn.classList.remove('selected');
          currentDockIdx = -1;
          unhighlightAll();
        } else {
          selectDockNode(idx);
        }
      });
      track.appendChild(btn);
    });

    // Auto-select finish update, current segment, or first segment
    var autoIdx = 0;
    if (tripStatus.finished) {
      autoIdx = 0;
    } else if (tripStatus.active) {
      var updCount = (tripStatus.updates || []).length;
      // updates come first; current segment follows at updCount + (currentSegment - 1 index in segments array)
      var segIdx = segments.findIndex(function (s) { return s.id === tripStatus.currentSegment; });
      autoIdx = updCount + (segIdx >= 0 ? segIdx : 0);
    } else {
      // No active trip: start at first segment node (after any updates)
      autoIdx = (tripStatus.updates || []).length;
    }
    // Scroll dock track to auto-selected node but don't open detail on load — let user discover
    var nodes = document.querySelectorAll('.dock-node');
    if (nodes[autoIdx]) {
      setTimeout(function () {
        nodes[autoIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        nodes[autoIdx].classList.add(tripHasProgress() ? 'selected' : '');
        if (tripHasProgress()) { currentDockIdx = autoIdx; selectDockNode(autoIdx); }
      }, 400);
    }
  }

  // Update HUD live indicator
  function initHudLive() {
    if (!tripHasProgress()) return;
    var wrap = document.getElementById('hud-live-wrap');
    var txt = document.getElementById('hud-live-text');
    if (wrap && txt) {
      txt.textContent = tripStatus.finished
        ? tripStatus.currentCity + ' \u00b7 Trip complete'
        : tripStatus.currentCity + (tripStatus.dayNumber ? ' · Day ' + tripStatus.dayNumber : '');
      var liveEl = wrap.querySelector('.hud-live');
      if (liveEl && tripStatus.finished) liveEl.classList.add('hud-finished');
      wrap.style.display = 'block';
    }
  }

  function updateDockHeight() {
    var dock = document.getElementById('trip-dock');
    if (!dock) return;
    var h = dock.offsetHeight;
    // Add a small extra buffer so controls sit clearly above the dock
    document.documentElement.style.setProperty('--dock-h', (h + 8) + 'px');
  }

  document.addEventListener('DOMContentLoaded', function () {
    initSidebar();
    initHudLive();
  });
})();

/* PWA service worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(new URL('sw.js', window.location.href)).catch(function () {});
}
</script>
